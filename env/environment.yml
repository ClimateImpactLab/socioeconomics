name: socioeconomics-new
channels:
  - conda-forge
dependencies:
  # R
  - r-base=4.4
  - r-data.table>=1.16.0
  - r-targets
  - r-yaml
  - r-readxl
  - r-countrycode
  - r-testthat
  # geospatial
  - r-terra
  - r-sf
  - r-exactextractr
  # output formats
  - r-ncdf4
  # python
  - python=3.11
  - xarray
  # zarr 3 defaults to the V3 store format; the canonical output must stay
  # V2 to remain a drop-in for readers of the bc39 benchmark store.
  - zarr>=2.18,<3
  - netcdf4
  - pandas
  - pip
  - pip:
      - pyam-iamc
