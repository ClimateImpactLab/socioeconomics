[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irpanel"
version = "0.1.0"
description = "Impact-region socioeconomic panel pipeline (CIL 2.0)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "geopandas",
    "pyogrio",
    "shapely>=2",
    "pyproj",
    "rasterio",
    "exactextract>=0.3.0",
    "country_converter",
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["irpanel*"]
