# Agriculture quick test (wheat_winter): one run (rcp45 / CCSM4 / low /
# SSP3) with the new socioeconomic panel, writing full adaptation, noadapt,
# incadapt and global, each also with historical climate (histclim). Results
# land under <outputdir>/quick_test/rcp45/CCSM4/low/SSP3/.
import: "../wheat_winter_pbarspline.yml"
mode: single
singledir: quick_test
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/wheat_winter
do_farmers: 'always'
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP3
only-iam: low
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
