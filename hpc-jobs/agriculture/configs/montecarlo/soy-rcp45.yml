# Agriculture montecarlo (soy, rcp45): one batch of draws over all rcp45
# GCMs for every SSP and IAM the projection system finds, writing full
# adaptation, noadapt, incadapt and histclim. The batch number is not set
# here: montecarlo.sbatch passes it on the command line
# (--only-batch-number). Results land under
# <outputdir>/batch<N>/<rcp>/<GCM>/<iam>/<ssp>/.
import: "../soy-160221.yml"
mode: montecarlo
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/soy/montecarlo
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp45
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
