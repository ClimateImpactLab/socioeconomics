# Agriculture montecarlo (rice, rcp85): one batch of draws over all rcp85
# GCMs for every SSP and IAM, with full adaptation, noadapt, incadapt, and
# histclim. The batch number is not set here: montecarlo.sbatch passes it on
# the command line (--only-batch-number). Results land under
# <outputdir>/batch<N>/<rcp>/<GCM>/<iam>/<ssp>/.
import: "../rice-160221.yml"
mode: montecarlo
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/montecarlo/rice
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp85
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
