# Agriculture single (wheat_winter): one run (rcp45 / CCSM4 / high / SSP4)
# with the new socioeconomic panel, writing full adaptation, noadapt,
# incadapt and global, each also with historical climate (histclim). Results
# land under <outputdir>/single/<rcp>/CCSM4/<iam>/<ssp>/.
import: "../wheat_winter_pbarspline.yml"
mode: single
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/wheat_winter
do_farmers: 'always'
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP4
only-iam: high
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
