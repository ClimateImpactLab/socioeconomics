# Agriculture single (sorghum): one run (rcp45 / CCSM4 / high / SSP3) with
# the new socioeconomic panel, writing full adaptation, noadapt, incadapt
# and global, each also with historical climate (histclim). Results land
# under <outputdir>/single/<rcp>/CCSM4/<iam>/<ssp>/.
import: "../sorghum-160221.yml"
mode: single
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/sorghum
do_farmers: 'always'
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP3
only-iam: high
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
