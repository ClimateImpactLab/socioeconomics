# Agriculture single (corn): one run (rcp85 / CCSM4 / high / SSP4) with the
# new socioeconomic panel, writing full adaptation, noadapt, incadapt and
# global, each also with historical climate (histclim). Results land under
# <outputdir>/single/<rcp>/CCSM4/<iam>/<ssp>/.
import: "../corn-160221.yml"
mode: single
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/corn
do_farmers: 'always'
do_historical: true
only-rcp: rcp85
only-models: [CCSM4]
only-ssp: SSP4
only-iam: high
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
