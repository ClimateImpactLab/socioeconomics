# Agriculture single (wheat_spring): one run (rcp85 / CCSM4 / low / SSP3)
# with the new socioeconomic panel, writing full adaptation, noadapt,
# incadapt and global, each also with historical climate (histclim). Results
# land under <outputdir>/single/<rcp>/CCSM4/<iam>/<ssp>/.
import: "../wheat_spring_pbarspline.yml"
mode: single
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/wheat_spring
do_farmers: 'always'
do_historical: true
only-rcp: rcp85
only-models: [CCSM4]
only-ssp: SSP3
only-iam: low
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
