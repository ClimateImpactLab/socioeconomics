# Agriculture median (cassava, rcp45): point estimate over all rcp45 GCMs
# for every SSP and IAM the projection system knows (no only-ssp or only-iam
# filter), with full adaptation, noadapt, incadapt, and histclim. Median
# mode adds its own median/ level: results land under
# <outputdir>/median/<rcp>/<GCM>/<iam>/<ssp>/.
import: "../cassava-110221.yml"
mode: median
outputdir: /project/cil/gcp/outputs_newsocioeconomics/agriculture/median/cassava
timeout: 12
do_farmers: true
do_historical: true
only-rcp: rcp45
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
