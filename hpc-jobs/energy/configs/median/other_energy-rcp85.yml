# Energy median (other_energy, rcp85): point estimate over all rcp85 GCMs
# for every SSP/IAM combination in the new socioeconomic panel (no
# only-ssp/only-iam filter). Every adaptation variant (do_farmers
# 'always'). Median mode appends its own
# median/ level: results land under <outputdir>/median/<rcp>/<GCM>/<iam>/<ssp>/.
import: "../hddcddspline_OTHERIND_other_energy.yml"
mode: median
outputdir: /project/cil/gcp/outputs_newsocioeconomics/energy/other_energy
deltamethod: no
do_farmers: 'always'
do_historical: true
only-rcp: rcp85
econcovar:
   class: mean
   length: 15
climcovar:
   class: mean
   length: 30
loggdppc-delta: 9.087
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
