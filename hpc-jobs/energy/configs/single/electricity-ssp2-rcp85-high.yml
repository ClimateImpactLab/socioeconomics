# Energy single (electricity): one realization (rcp85 / CCSM4 / high /
# SSP2) against the new socioeconomic panel, with every adaptation
# variant (do_farmers 'always').
# Results land under <outputdir>/single/<rcp>/CCSM4/<iam>/<ssp>/.
import: "../hddcddspline_OTHERIND_electricity.yml"
mode: single
outputdir: /project/cil/gcp/outputs_newsocioeconomics/energy/electricity
deltamethod: no
do_farmers: 'always'
do_historical: true
only-rcp: rcp85
only-models: [CCSM4]
only-ssp: SSP2
only-iam: high
econcovar:
   class: mean
   length: 15
climcovar:
   class: mean
   length: 30
loggdppc-delta: 9.087
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
