# Energy quick test (electricity): single realization (rcp45 / CCSM4 /
# low / SSP3) against the new socioeconomic panel, with every adaptation
# variant (full, noadapt, incadapt, global, and their histclim
# counterparts; do_farmers 'always').
# Results land under <outputdir>/quick_test/rcp45/CCSM4/low/SSP3/.
import: "../hddcddspline_OTHERIND_electricity.yml"
mode: single
singledir: quick_test
outputdir: /project/cil/gcp/outputs_newsocioeconomics/energy/electricity
deltamethod: no
do_farmers: 'always'
do_historical: true
only-rcp: rcp45
only-models: [CCSM4]
only-ssp: SSP3
only-iam: low
econcovar:
   class: mean
   length: 15
climcovar:
   class: mean
   length: 30
loggdppc-delta: 9.087
socioeconomic_data_dir: /project/cil/gcp/outputs_newsocioeconomics/socioeconomics/1.0.0/
