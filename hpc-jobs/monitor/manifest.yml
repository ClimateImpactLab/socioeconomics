# Manifest for the AMEL run-status dashboard.
# This file describes everything the dashboard tracks. The mock generator and
# the real collector both read it, so nothing about the run universe is
# hardcoded in code. Edit this file to add scenarios, GCMs, sectors or people.

account:
  name: cil

# People shown in the service-units panel. Fill in the cluster username for
# each person; the collector uses it to split sacct usage by person.
people:
  - name: Sebastian
    username: null
  - name: Diana
    username: null
  - name: Marine
    username: null
  - name: Maiqi
    username: null
  - name: Adwait
    username: null
  - name: Sila
    username: null
  - name: Sarah
    username: null

# Scenario space. valid_pairs lists the SSP-RCP combinations the projection
# engine accepts (it drops SSP1 with rcp85, and SSP5 with anything but rcp85).
scenarios:
  ssps: [SSP1, SSP2, SSP3, SSP4, SSP5]
  rcps: [rcp45, rcp85]
  valid_pairs:
    SSP1: [rcp45]
    SSP2: [rcp45, rcp85]
    SSP3: [rcp45, rcp85]
    SSP4: [rcp45, rcp85]
    SSP5: [rcp85]
  iams: [low, high]

# GCM lists per RCP, taken from the legacy mortality trees
# (/project/cil/gcp/outputs/mortality_new-socioeconomics and the glocal median
# runs). rcp85 has one extra surrogate (surrogate_GFDL-ESM2G_06).
gcms:
  rcp45:
    - ACCESS1-0
    - bcc-csm1-1
    - BNU-ESM
    - CanESM2
    - CCSM4
    - CESM1-BGC
    - CNRM-CM5
    - CSIRO-Mk3-6-0
    - GFDL-CM3
    - GFDL-ESM2G
    - GFDL-ESM2M
    - inmcm4
    - IPSL-CM5A-LR
    - IPSL-CM5A-MR
    - MIROC-ESM
    - MIROC-ESM-CHEM
    - MIROC5
    - MPI-ESM-LR
    - MPI-ESM-MR
    - MRI-CGCM3
    - NorESM1-M
    - surrogate_CanESM2_89
    - surrogate_CanESM2_94
    - surrogate_CanESM2_99
    - surrogate_GFDL-CM3_89
    - surrogate_GFDL-CM3_94
    - surrogate_GFDL-CM3_99
    - surrogate_GFDL-ESM2G_01
    - surrogate_GFDL-ESM2G_11
    - surrogate_MRI-CGCM3_01
    - surrogate_MRI-CGCM3_06
    - surrogate_MRI-CGCM3_11
  rcp85:
    - ACCESS1-0
    - bcc-csm1-1
    - BNU-ESM
    - CanESM2
    - CCSM4
    - CESM1-BGC
    - CNRM-CM5
    - CSIRO-Mk3-6-0
    - GFDL-CM3
    - GFDL-ESM2G
    - GFDL-ESM2M
    - inmcm4
    - IPSL-CM5A-LR
    - IPSL-CM5A-MR
    - MIROC-ESM
    - MIROC-ESM-CHEM
    - MIROC5
    - MPI-ESM-LR
    - MPI-ESM-MR
    - MRI-CGCM3
    - NorESM1-M
    - surrogate_CanESM2_89
    - surrogate_CanESM2_94
    - surrogate_CanESM2_99
    - surrogate_GFDL-CM3_89
    - surrogate_GFDL-CM3_94
    - surrogate_GFDL-CM3_99
    - surrogate_GFDL-ESM2G_01
    - surrogate_GFDL-ESM2G_06
    - surrogate_GFDL-ESM2G_11
    - surrogate_MRI-CGCM3_01
    - surrogate_MRI-CGCM3_06
    - surrogate_MRI-CGCM3_11

# How each run type fills the scenario space.
# cells: all        -> every valid SSP-RCP pair crossed with both IAMs
# gcms: [CCSM4]     -> pinned to one GCM (what the single configs do)
# gcms: per_rcp     -> the full GCM list above for each RCP
run_types:
  quick_test:
    cells:
      ssps: [SSP3]
      rcps: [rcp45]
      iams: [low]
    gcms: [CCSM4]
    batches: null
  single:
    cells: all
    gcms: [CCSM4]
    batches: null
  median:
    cells: all
    gcms: per_rcp
    batches: null
  montecarlo:
    cells: all
    gcms: per_rcp
    batches: 15          # batch0 .. batch14, as in the legacy mortality runs

# Sectors. models are the sub-models that each get their own full grid
# (crops for agriculture, fuels for energy; "main" means no sub-model).
# stages are the pipeline steps a unit needs before it counts as done.
# derived_models are created by the post stage, not run on their own.
# Paths are relative to the cluster filesystem (/project/cil = /Volumes/cil).
sectors:
  mortality:
    label: Mortality
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    output_root: /project/cil/gcp/outputs_newsocioeconomics/mortality
    logs_root: logs/mortality
    job_names:
      quick_test: mortality-quick-test
      single: mortality-single
      median: mortality-median
      montecarlo: mortality-montecarlo
    log_prefixes:
      quick_test: qt
      single: sg
      median: med
      montecarlo: mc

  agriculture:
    label: Agriculture
    models: [cassava, corn, rice, sorghum, soy, wheat_spring, wheat_winter]
    derived_models: [wheat_combined]
    stages: [generate, aggregate, costs, post]
    run_types: [quick_test, single, median, montecarlo]
    output_root: /project/cil/gcp/outputs_newsocioeconomics/agriculture
    logs_root: logs/agriculture
    job_names:
      quick_test: agriculture-quick-test
      single: agriculture-single
      median: agriculture-median
      montecarlo: agriculture-montecarlo
    log_prefixes:
      quick_test: qt
      single: sg
      median: med
      montecarlo: mc

  energy:
    label: Energy
    models: [electricity, other_energy]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    output_root: /project/cil/gcp/outputs_newsocioeconomics/energy
    logs_root: logs/energy
    job_names:
      quick_test: energy-quick-test
      single: energy-single
      median: energy-median
      montecarlo: energy-montecarlo
    log_prefixes:
      quick_test: qt
      single: sg
      median: med
      montecarlo: mc

  labor:
    label: Labor
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    output_root: /project/cil/gcp/outputs_newsocioeconomics/labor
    logs_root: logs/labor
    job_names:
      quick_test: labor-quick-test
      single: labor-single
      median: labor-median
      montecarlo: labor-montecarlo
    log_prefixes:
      quick_test: qt
      single: sg
      median: med
      montecarlo: mc

