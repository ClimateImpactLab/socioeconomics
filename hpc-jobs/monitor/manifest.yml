# How each run type fills the scenario space.
# cells: all        -> every valid SSP-RCP pair crossed with both IAMs
# gcms: [CCSM4]     -> pinned to one GCM (what the single configs do)
# gcms: per_rcp     -> the full GCM list above for each RCP
# subdir is a folder the engine adds itself after the config's outputdir.
# Median mode writes <outputdir>/median/<rcp>/<GCM>/<iam>/<SSP>/, so its
# leaves sit one level deeper than the run type folder.
# enabled: false leaves a run type out of the dashboard entirely (no tab,
# and not in any count, percent, card or SU estimate). Set it back to true,
# or remove the line, to show it again.
run_types:
  quick_test:
    enabled: false
    cells:
      ssps: [SSP3]
      rcps: [rcp45]
      iams: [low]
    gcms: [CCSM4]
    batches: null
    subdir: null
  single:
    cells: all
    gcms: [CCSM4]
    batches: null
    subdir: null
  median:
    cells: all
    gcms: per_rcp
    batches: null
    subdir: median
  montecarlo:
    cells: all
    gcms: per_rcp
    batches: 15          # batch0 .. batch14, as in the legacy mortality runs
    subdir: null         # check against the first montecarlo outputs

# Sectors. models are the sub-models that each get their own full grid
# (crops for agriculture, fuels for energy; "main" means no sub-model).
# stages are the pipeline steps a unit needs before it counts as done.
# derived_models are created by the post stage, not run on their own.
# Paths are on the cluster filesystem (/project/cil = /Volumes/cil).
# The grid is built from these folders only.
sectors:
  mortality:
    label: Mortality
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    # Reference for the SU estimate when no unit has finished yet. 20.5 h per
    # unit from earlier production runs; the cil2 single runs logged 23.1 h
    # (median of 8 tasks). Job limit from the cil2 generate sbatch (caslake, 45G).
    reference:
      hours_per_unit: 20.5
      hours_per_unit_max: 23.7   # longest of the 8 cil2 single tasks
      billing: 1
      time_limit_hours: 36
    output_root: /project/cil/gcp/outputs_newsocioeconomics/mortality

  agriculture:
    label: Agriculture
    # wheat_combined is built from spring and winter wheat by the post stage;
    # only it is aggregated, so spring and winter have no aggregated files.
    models: [cassava, corn, rice, sorghum, soy, wheat_spring, wheat_winter, wheat_combined]
    stages: [generate, aggregate, costs, post]
    run_types: [quick_test, single, median, montecarlo]
    # No reference time yet for the new runs, so the SU estimate shows
    # "not known yet". (The cil2 test runs logged 2.1 h per unit, longest
    # 6.2 h.) Job limit from the cil2 generate sbatch (caslake, 50G).
    reference:
      hours_per_unit: null
      billing: 1
      time_limit_hours: 12
    output_root: /project/cil/gcp/outputs_newsocioeconomics/agriculture

  energy:
    label: Energy
    models: [electricity, other_energy]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median]
    disabled_run_types: [montecarlo]   # shown as a greyed-out tab, not tracked
    # Reference: about 6.5 h per unit on 1 CPU from earlier production runs;
    # the cil2 single runs logged 3.5 h (median of 16 tasks). Job limits from
    # hpc-jobs/energy/jobs (partition cil, 50G).
    reference:
      hours_per_unit: 6.5
      billing: 1
      time_limit_hours: {quick_test: 12, single: 12, median: 36}
    output_root: /project/cil/gcp/outputs_newsocioeconomics/energy

  labor:
    label: Labor
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    # Reference: cil2 single runs logged 1.4 h per unit (median of 8 tasks).
    # Job limit from the earlier labor sbatch: account cil, partition caslake,
    # 1 task, 64G, 36 h, array 0-47.
    reference:
      hours_per_unit: 1.4
      hours_per_unit_max: 1.42   # longest of the 8 cil2 single tasks
      billing: 1
      time_limit_hours: 36
    output_root: /project/cil/gcp/outputs_newsocioeconomics/labor

