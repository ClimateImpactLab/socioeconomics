# Manifest for the AMEL run-status dashboard.
# This file describes everything the dashboard tracks. The mock generator and
# the real collector both read it, so nothing about the run universe is
# hardcoded in code. Edit this file to add scenarios, GCMs, sectors or people.

account:
  name: cil
  # Cluster users always listed in Resources, even with no jobs yet.
  always_show_users: [silacetiner, dtadeo]
  # Shown in black instead of a palette color.
  highlight_user: cadavidsanchez
  # Job names that never count as projection tasks (aggregation, post
  # processing, costs and the monitor itself), case does not matter.
  job_names_exclude: ["*agg*", "*post*", "*cost*", "amel-monitor"]
  # RCC's billing formula, as RCC gave it:
  #   SUs = hours x max(cores requested, RAM requested / RAM per core)
  # Only the billed partitions count; the others are 0 SUs. For caslake,
  # 3.75 GB per core matches RCC's bills exactly (1 core and 15G billed 4 SUs
  # per hour, 1 core and 45G billed 12).
  rcc_billing:
    billed_partitions: [caslake]
    ram_per_core_gb:
      caslake: 3.75
  # Jobs that ended badly (timeout, out of memory, failed, cancelled) are
  # listed under SLURM jobs for this many days.
  ended_badly_days: 3

# Scenarios covered by the runs, as in the original specifications: SSP2,
# SSP3 and SSP4, each with rcp45 and rcp85 and both IAMs (12 scenarios).
# valid_pairs lists the RCPs run for each SSP.
scenarios:
  ssps: [SSP2, SSP3, SSP4]
  rcps: [rcp45, rcp85]
  valid_pairs:
    SSP2: [rcp45, rcp85]
    SSP3: [rcp45, rcp85]
    SSP4: [rcp45, rcp85]
  iams: [low, high]

