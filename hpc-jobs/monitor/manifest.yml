# Manifest for the AMEL run-status dashboard.
# This file describes everything the dashboard tracks. The mock generator and
# the real collector both read it, so nothing about the run universe is
# hardcoded in code. Edit this file to add scenarios, GCMs, sectors or people.

account:
  name: cil
  su_since: "2026-10-01"   # start of the current cycle; service units count from here
  # RCC formula for non GPU jobs: SUs = ElapsedRaw / 3600 x billing, with
  # billing read from each job's AllocTRES. It applies on these partitions.
  su_billing_partitions: [amd, caslake, amd-hm]
  # The group's own nodes: no SUs, shown as core hours only.
  su_free_partitions: [cil]
  # bigmem and GPU jobs (and any partition not listed above) use other
  # formulas: they are listed as flagged, with their hours, not counted.
  # Cluster users always listed in Resources, even with no jobs yet.
  always_show_users: [silacetiner, dtadeo]
  # Shown in black instead of a palette color.
  highlight_user: cadavidsanchez
  # Jobs that ended badly (timeout, out of memory, failed, cancelled) are
  # listed under SLURM jobs for this many days.
  ended_badly_days: 3

# Scenario space. valid_pairs lists the SSP-RCP combinations the projection
# engine accepts (it drops SSP1 with rcp85, and SSP5 with anything but rcp85).
scenarios:
  ssps: [SSP1, SSP2, SSP3, SSP4, SSP5]
  rcps: [rcp45, rcp85]
  valid_pairs:
    SSP1: [rcp45]
    SSP2: [rcp45, rcp85]
    SSP3: [rcp45, rcp85]
    SSP4: [rcp45, rcp85]
    SSP5: [rcp85]
  iams: [low, high]

# GCM lists per RCP, taken from the legacy mortality trees
# (/project/cil/gcp/outputs/mortality_new-socioeconomics and the glocal median
# runs). rcp85 has one extra surrogate (surrogate_GFDL-ESM2G_06).
