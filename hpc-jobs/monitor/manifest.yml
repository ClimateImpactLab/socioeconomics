# How each run type fills the scenario space.
# cells: all        -> every valid SSP-RCP pair crossed with both IAMs
# gcms: [CCSM4]     -> pinned to one GCM (what the single configs do)
# gcms: per_rcp     -> the full GCM list above for each RCP
# subdir is a folder the engine adds itself after the config's outputdir.
# Median mode writes <outputdir>/median/<rcp>/<GCM>/<iam>/<SSP>/, so its
# leaves sit one level deeper than the run type folder.
# enabled: false leaves a run type out of the dashboard entirely (no tab,
# and not in any count, percent, card or SU estimate). Set it back to true,
# or remove the line, to show it again.
# one_unit_per_task: each Slurm task does one unit, so the time per unit
# comes straight from sacct (elapsed x billing of the finished tasks).
run_types:
  quick_test:
    enabled: false
    one_unit_per_task: true
    cells:
      ssps: [SSP3]
      rcps: [rcp45]
      iams: [low]
    gcms: [CCSM4]
    batches: null
    subdir: null
  single:
    cells: all
    gcms: [CCSM4]
    batches: null
    subdir: null
    one_unit_per_task: true
  median:
    cells: all
    gcms: per_rcp
    batches: null
    subdir: median
  montecarlo:
    cells: all
    gcms: per_rcp
    batches: 15          # batch0 .. batch14, as in the legacy mortality runs
    subdir: null         # check against the first montecarlo outputs

# Sectors. layout is the folder path from output_root down to the rcp
# folders, built from {run_type}, {model} and {subdir} (empty parts are
# dropped); the default is "{run_type}/{model}/{subdir}". Batch folders
# come right after it.
# job_names: Slurm job name patterns of the projection tasks of each run
# type, used to take the time per unit from sacct. * matches anything and
# case does not matter, so "*energy*med*" matches cil2-energy-med and
# energy-median. Each pattern comes in both word orders so names from
# people's own scripts still match. A task that matches several run types
# goes to the most specific one: montecarlo, then median, then quick_test,
# then single. Names matching job_names_exclude (below) never count.
# Only tasks that started since the run's start count: run_started when set
# (local cluster time), or else the run's first projection file less the
# job time limit.
# models are the sub-models that each get their own full grid
# (crops for agriculture, fuels for energy; "main" means no sub-model).
# stages are the pipeline steps a unit needs before it counts as done.
# derived_models are created by the post stage, not run on their own.
# Paths are on the cluster filesystem (/project/cil = /Volumes/cil).
# The grid is built from these folders only.
sectors:
  mortality:
    label: Mortality
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    # Reference for the SU estimate when no unit has finished yet. 20.5 h per
    # unit from earlier production runs; the cil2 single runs logged 23.1 h
    # (median of 8 tasks). Job limit from the cil2 generate sbatch (caslake, 45G).
    reference:
      hours_per_unit: 20.5
      hours_per_unit_max: 23.7   # longest of the 8 cil2 single tasks
      billing: 1
      time_limit_hours: 36
      # What the tasks ask for, from the jobs in use; used for the SUs only
      # when the run's jobs cannot be matched in sacct. Mortality montecarlo.
      request: {partition: caslake, cpus: 1, mem_gb: 45}
    output_root: /project/cil/gcp/outputs_newsocioeconomics/mortality
    job_names:
      single: [cil2wpp-mort-gen, "*mort*single*", "*single*mort*", "*mort*gen*"]
      median: ["*mort*med*", "*med*mort*"]
      montecarlo: [mort-mc-*, "*mort*mc*", "*mc*mort*", "*mort*monte*", "*monte*mort*"]

  agriculture:
    label: Agriculture
    # wheat_combined is built from spring and winter wheat by the post stage;
    # only it is aggregated, so spring and winter have no aggregated files.
    models: [cassava, corn, rice, sorghum, soy, wheat_spring, wheat_winter, wheat_combined]
    stages: [generate, aggregate, costs, post]
    run_types: [quick_test, single, median, montecarlo]
    # No reference time yet for the new runs, so the SU estimate shows
    # "not known yet". (The cil2 test runs logged 2.1 h per unit, longest
    # 6.2 h.) Job limit from the cil2 generate sbatch (caslake, 50G).
    reference:
      hours_per_unit: null
      billing: 1
      time_limit_hours: 12
      request: {partition: amd, cpus: 1, mem_gb: 28}   # hpc-jobs/agriculture single
    output_root: /project/cil/gcp/outputs_newsocioeconomics/agriculture
    # Agriculture keeps each crop first, then the run type, as energy does:
    # agriculture/corn/single/rcp45/... wheat_combined (built by the post
    # stage) and the winsorized twin folders follow the same rule:
    # agriculture/wheat_combined/single/... and
    # agriculture/corn-1pct_winsorization/single/... The global variants the
    # singles also write are listed as other files, not counted.
    layout: "{model}/{run_type}"
    job_names:
      single: [cil2wpp-ag-gen, "*agri*single*", "*single*agri*", "*-ag-*single*", "*ag-gen*"]
      median: ["*agri*med*", "*med*agri*", "*-ag-*med*", "ag-med*"]
      montecarlo: ["*agri*mc*", "*mc*agri*", "*-ag-*mc*", "ag-mc*", "*agri*monte*"]

  energy:
    label: Energy
    models: [electricity, other_energy]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median]
    disabled_run_types: [montecarlo]   # shown as a greyed-out tab, not tracked
    # Reference: about 6.5 h per unit on 1 CPU from earlier production runs;
    # the cil2 single runs logged 3.5 h (median of 16 tasks). Job limits from
    # hpc-jobs/energy/jobs (partition cil, 50G).
    reference:
      hours_per_unit: 6.5
      billing: 1
      time_limit_hours: {quick_test: 12, single: 12, median: 36}
      request:
        partition: amd           # hpc-jobs/energy single
        cpus: 1
        mem_gb: 15
        by_run_type:
          median: {partition: caslake}   # the median that ran on caslake, also 15G
    output_root: /project/cil/gcp/outputs_newsocioeconomics/energy
    # Energy keeps each fuel first, then the run type, with no extra median
    # folder: energy/electricity/median/rcp45/...
    layout: "{model}/{run_type}"
    # The scenario in the aggregation file names that counts for progress.
    # Aggregation files under other scenarios in the same folders (such as
    # MERGEETL60_rcp45) are found on their own and can be picked on the page.
    aggregation_scenario: price014
    job_names:
      quick_test: [energy-quick-test, cil2wpp-energy-smoke, "*energy*quick*", "*energy*smoke*", "*energy*test*"]
      single: [energy-single, cil2wpp-energy-gen, "*energy*single*", "*single*energy*", "*energy*gen*"]
      median: [cil2-energy-med, "*energy*med*", "*med*energy*"]
    run_started:
      median: "2026-10-15T16:30:00"

  labor:
    label: Labor
    models: [main]
    stages: [generate, aggregate]
    run_types: [quick_test, single, median, montecarlo]
    # Reference: cil2 single runs logged 1.4 h per unit (median of 8 tasks).
    # Job limit from the earlier labor sbatch: account cil, partition caslake,
    # 1 task, 64G, 36 h, array 0-47.
    reference:
      hours_per_unit: 1.4
      hours_per_unit_max: 1.42   # longest of the 8 cil2 single tasks
      billing: 1
      time_limit_hours: 36
      request: {partition: amd, cpus: 1, mem_gb: 60}   # hpc-jobs/labor single
    output_root: /project/cil/gcp/outputs_newsocioeconomics/labor
    job_names:
      single: [cil2wpp-labor-gen, "*labo*single*", "*single*labo*", "*labo*gen*"]
      median: ["*labo*med*", "*med*labo*"]
      montecarlo: ["*labo*mc*", "*mc*labo*", "*labo*monte*", "*monte*labo*"]

