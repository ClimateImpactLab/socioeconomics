# Placeholder. Describes the final panel: dimensions, variables, units. Finalized
# alongside the postprocess and write_outputs implementation; units below are
# indicative until then.

dimensions:
  hierid:    "Impact-region identifier (~24,378 terminal regions)"
  year:      "Calendar year, 1981-2100"
  scenario:  "SSP scenario (e.g. SSP2, SSP3)"
  gdp_model: "GDP projection model (OECD | IIASA)"

variables:
  iso3:            { units: "code",        desc: "ISO3 country code" }
  gdppc:           { units: "USD PPP (constant base yr TBD)", desc: "GDP per capita, post-processed (smoothed)" }
  gdppc_raw:       { units: "USD PPP",     desc: "GDP per capita, unsmoothed" }
  gdp:             { units: "USD PPP",     desc: "gdppc * pop (Delta #2: sums to national GDP)" }
  pop:             { units: "persons",     desc: "Population (Delta #1: scaled to UN WPP)" }
  area_km2:        { units: "km^2",        desc: "IR geodesic area (static)" }
  pop_density:     { units: "persons/km^2", desc: "pop / area_km2" }
  pop_wtd_density: { units: "persons/km^2", desc: "Population-weighted density (base-year, static)" }
  pop0to4:         { units: "persons",     desc: "Population age 0-4" }
  pop5to64:        { units: "persons",     desc: "Population age 5-64" }
  pop65plus:       { units: "persons",     desc: "Population age 65+" }
