# Raw inputs for the pipeline. Paths are relative to source_dir, which lives
# outside the repo: files are referenced and verified in place, never copied in
# or version-controlled here. get_data.R reads this file to fetch (auto) or
# verify (manual) each input against its md5.
#
# Not listed as fetchable: the IR shapefile and the benchmark zarr. They are
# read-only on the shared volume by absolute path (see config.yml) and are
# neither downloaded nor versioned.

source_dir: ../source_data

sources:

  penn_world_table:
    description: Penn World Table 11.0 national accounts (GDP, population, PPP).
    version: "11.0"
    doi: "10.34894/FABVLR"
    homepage: "https://www.rug.nl/ggdc/productivity/pwt/"
    license: "CC BY 4.0"
    files:
      - path: pwt110.xlsx
        md5: f051c9340d641d6ad8494d6137a25f1e
        bytes: 5839841
        fetch: auto
        # Verified Dataverse dataset-bundle endpoint: download the bundle and
        # extract pwt110.xlsx by basename (member: null). The extracted file's
        # md5 is checked; the bundle itself is not pinned (regenerated
        # server-side), so archive.md5 is null.
        archive:
          url: "https://dataverse.nl/api/access/dataset/:persistentId?persistentId=doi:10.34894/FABVLR"
          md5: null
          member: null

  kummu_2025:
    description: >
      Kummu et al. (2025) gridded subnational GDP per capita and the aligned
      GHS-POP population raster. We use the 1990-2022 release (Zenodo 13943886),
      matching the book; a newer record extends to 2024 and is deliberately not
      used.
    version: "1990-2022 (Zenodo record 13943886)"
    doi: "10.5281/zenodo.13943886"
    homepage: "https://zenodo.org/records/13943886"
    license: "CC BY 4.0"
    files:
      - path: Kummu/rast_adm2_gdp_perCapita_1990_2022.tif
        md5: 80e3759c980b9fdd7c1b52fd5c930818
        bytes: 113917143
        fetch: auto
        url: "https://zenodo.org/records/13943886/files/rast_adm2_gdp_perCapita_1990_2022.tif?download=1"

      - path: Kummu/tabulated_adm0_gdp_perCapita.csv
        md5: 3475f057a541e358b77b10c584a1336f
        bytes: 49480
        fetch: auto
        url: "https://zenodo.org/records/13943886/files/tabulated_adm0_gdp_perCapita.csv?download=1"

      - path: Kummu/r_pop_GHS_1990_2022_5arcmin.tif
        md5: 8da3fcaf0d7f42f95c39b20dc0d073b8
        bytes: 195106113
        fetch: auto
        # Not a standalone download: this file ships inside Kummu's
        # code_input_data.zip, already resampled to Kummu's 5-arcmin grid. The
        # underlying product is GHS-POP R2023A (JRC); the aligned file comes from
        # Kummu's bundle. Fetch the zip, extract the one member, verify.
        source_note: "GHS-POP R2023A (JRC), aligned and redistributed by Kummu."
        archive:
          url: "https://zenodo.org/records/13943886/files/code_input_data.zip?download=1"
          md5: 8c43b0608bcb22216e0b832edc7b8574
          bytes: 492921109
          member: code_input_data/data_gis/r_pop_GHS_1990_2022_5arcmin.tif

  ssp_v3:
    description: >
      IIASA SSP scenario database, release 3.0 "basic drivers full". Provides the
      three models the pipeline uses: OECD ENV-Growth 2023, IIASA GDP 2023, and
      IIASA-WiC POP 2023.
    version: "3.0 (January 2024)"
    homepage: "https://data.ece.iiasa.ac.at/ssp"
    license: "check source (IIASA SSP data licence)"
    files:
      - path: 1706548837040-ssp_basic_drivers_release_3.0_full.xlsx
        md5: 28d1b6d7ab6c09dc563567831539ce17
        bytes: 59431699
        fetch: manual
        # Exported by hand from the Scenario Explorer; no stable single-file URL.
        instructions: >
          Download from https://data.ece.iiasa.ac.at/ssp (release 3.0, "basic
          drivers 3.0 full") and save as
          1706548837040-ssp_basic_drivers_release_3.0_full.xlsx.

  un_wpp_2024:
    description: UN World Population Prospects 2024, demographic indicators.
    version: "2024 revision, medium variant"
    homepage: "https://population.un.org/wpp/downloads"
    license: "CC BY 3.0 IGO (check source)"
    files:
      - path: WPP2024_GEN_F01_DEMOGRAPHIC_INDICATORS_COMPACT.xlsx
        md5: c34f07b99f2a636bb5149b18114d7e9f
        bytes: 26142942
        fetch: manual
        instructions: >
          Download from https://population.un.org/wpp/downloads (Standard
          Projections, medium variant) and save as
          WPP2024_GEN_F01_DEMOGRAPHIC_INDICATORS_COMPACT.xlsx.
